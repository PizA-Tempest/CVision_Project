services:
  - type: web
    name: cvision
    runtime: python
    region: oregon
    plan: 1c-2g
    buildCommand: pip install --upgrade pip && pip install -r CVReviwer/requirements.txt
    startCommand: streamlit run CVReviwer/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: cvision
    disk:
      name: cvision-uploads
      mountPath: /opt/render/project/src/CVReviwer/uploads
      sizeGB: 1

# NOTE: Render Blueprints only support Postgres in the `databases:` block,
# so MySQL is NOT defined here. Create a managed MySQL elsewhere
# (Aiven / Railway / your existing service in Oregon) and paste its
# host/user/password into DB_HOST / DB_USER / DB_PASSWORD above.
