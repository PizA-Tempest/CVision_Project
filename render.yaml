services:
  - type: web
    name: cvision
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r CVReviwer/requirements.txt
    startCommand: streamlit run CVReviwer/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: cvision

# Free plan: no persistent disk (uploads/ resets on restart).
# Paid 1c-2g + disk block restores persistence + RAM for torch.
