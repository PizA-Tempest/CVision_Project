services:
  - type: web
    name: cvision
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r CVReviwer/requirements.txt
    startCommand: streamlit run CVReviwer/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
      # Supabase free tier — paste the URI from Project Settings → Database
      - key: DATABASE_URL
        sync: false

# Free plan: no persistent disk (uploads/ resets on restart).
# Supabase free tier replaces Aiven for the PostgreSQL database.
