services:
  - type: web
    name: cvision
    runtime: python
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r CVReviwer/requirements.txt
    startCommand: streamlit run CVReviwer/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: cvision-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cvision-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: cvision-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cvision-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: cvision-db
          property: database
    disk:
      name: cvision-uploads
      mountPath: /opt/render/project/src/CVReviwer/uploads
      sizeGB: 1

databases:
  - name: cvision-db
    plan: basic-256mb
    mysqlVersion: "8.0"
